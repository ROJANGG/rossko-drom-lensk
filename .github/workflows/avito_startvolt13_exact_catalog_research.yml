name: Avito FIRST95 - 13 Startvolt glow plugs exact official OEM-photo audit (NOT LIVE)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/avito_startvolt13_exact_catalog_research.yml'
permissions:
  contents: read
jobs:
  manufacturer-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
        with:
          ref: afb469bb1e413f6775fdce5bfbbdd7709cda116c
          path: code
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'beautifulsoup4>=4.12' 'requests>=2.31,<3' 'pillow>=10,<13'
      - name: Inspect exact manufacturer pages, OEM codes and photo bytes
        run: python code/avito_startvolt13_exact_catalog_research.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AVITO_STARTVOLT_13_MANUFACTURER_EVIDENCE_REVIEW_ONLY
          path: manufacturer_items/
          retention-days: 3
          if-no-files-found: ignore
