name: Avito Irkutsk draft tests

on:
  push:
    branches: [feature/avito-irkutsk-draft]
    paths:
      - 'avito_irkutsk.py'
      - 'avito_feed.py'
      - 'avito_photo_check.py'
      - 'tests/test_avito*.py'
      - '.github/workflows/test_avito_draft.yml'
  pull_request:
    paths:
      - 'avito_irkutsk.py'
      - 'avito_feed.py'
      - 'tests/test_avito*.py'
      - '.github/workflows/test_avito_draft.yml'

jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install 'openpyxl>=3.1.2' 'requests>=2.31.0' 'pillow>=10.0.0'
      - name: Run Avito unit tests
        run: python -m unittest discover -s tests -p 'test_avito*.py' -v
