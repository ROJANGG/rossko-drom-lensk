name: Avito Irkutsk live pilot (review only)

on:
  workflow_dispatch:
  push:
    branches: [feature/avito-irkutsk-draft]
    paths:
      - '.github/workflows/avito_live_pilot.yml'
      - 'avito_irkutsk.py'

permissions:
  contents: read

jobs:
  candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install 'openpyxl>=3.1.2' 'requests>=2.31.0'
      - name: Download a live Rossko XLSX and select local stock
        run: |
          python avito_irkutsk.py --confirm-irkutsk-source --sku-whitelist input/avito_pilot_articles.csv --pilot-per-category 25 --out output/avito_irkutsk_pilot_review.csv
      - name: Upload review-only candidate CSV (expires after 1 day)
        uses: actions/upload-artifact@v4
        with:
          name: avito-irkutsk-review-pilot
          path: output/avito_irkutsk_pilot_review.csv
          if-no-files-found: error
          retention-days: 1
