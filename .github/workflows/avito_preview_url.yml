name: Publish pilot 4 XML to isolated preview branch (NOT automated live feed)

# Runs once when this workflow is added. It does not enable Avito or schedules.
on:
  push:
    branches: [feature/avito-irkutsk-draft]
    paths:
      - '.github/workflows/avito_preview_url.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: avito-4-preview-one-off
  cancel-in-progress: false

jobs:
  publish-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install 'openpyxl>=3.1.2' 'requests>=2.31.0' 'pillow>=10.0'
      - name: Download new ROSSKO price and verify 4 test articles
        run: python avito_sync_staging.py
      - name: Check XML has only four stable pilot IDs
        run: |
          python avito_feed_transition.py \
            --candidate output/avito_price_stock_staging/AVITO_XML_PRICE_STOCK_STAGING_NOT_LIVE.xml \
            --allow-initial-pilot
      - name: Fetch isolated preview branch
        uses: actions/checkout@v4
        with:
          ref: avito-irkutsk-feed
          path: avito-preview-branch
          persist-credentials: true
      - name: Write publicly viewable TEST snapshot only
        shell: bash
        run: |
          set -euo pipefail
          cp output/avito_price_stock_staging/AVITO_XML_PRICE_STOCK_STAGING_NOT_LIVE.xml avito-preview-branch/AVITO_PILOT_4_PREVIEW_NOT_LIVE.xml
          cd avito-preview-branch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AVITO_PILOT_4_PREVIEW_NOT_LIVE.xml
          if ! git diff --cached --quiet; then
            git commit -m "Avito: fresh 4-product XML for link testing only"
            git push origin HEAD:avito-irkutsk-feed
          fi
