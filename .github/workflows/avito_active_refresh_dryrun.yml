name: Avito Irkutsk active catalog price and stock refresh - DRY RUN
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/avito_active_refresh_dryrun.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ROSSKO_RUN_PRICE_CACHE: /tmp/rossko_${{ github.run_id }}.xlsx
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d1cc3f3a24ebe36b2b52576227b516cb8255d107
          path: generator
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: avito-irkutsk-feed
          path: preview
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: main
          path: wholesale_pricing
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python dependencies
        run: python -m pip install 'openpyxl>=3.1,<4' 'requests>=2.31,<3'
      - name: Test strict XML and supplier stock guards offline
        working-directory: generator
        run: python -m unittest discover -s tests -p test_avito_active_feed_refresh.py -v
      - name: Refresh active XML safely in private artifacts, without publishing
        run: |
          python generator/avito_active_feed_refresh.py \
            --config generator/config.json \
            --previous preview/AVITO_PILOT_4_PREVIEW_NOT_LIVE.xml \
            --approved-catalog preview/AVITO_APPROVED_CATALOG_195_ARCHIVE.xml \
            --verified-retail-map wholesale_pricing/input/rossko_verified_retail_prices.csv \
            --out output \
            --max-removals 12
      - name: Save private summary only, no public changes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AVITO_ACTIVE_CATALOG_REFRESH_DRYRUN
          path: output/report.json
          retention-days: 2
          if-no-files-found: ignore
