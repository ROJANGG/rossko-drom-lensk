name: Avito Rossko price and stock STAGING audit (not live)

on:
  workflow_dispatch:
  push:
    branches: [feature/avito-irkutsk-draft]
    paths:
      - 'avito_sync_staging.py'
      - 'input/avito_oem_verified.csv'
      - '.github/workflows/avito_sync_staging.yml'

permissions:
  contents: read

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install 'openpyxl>=3.1.2' 'requests>=2.31.0' 'pillow>=10.0'
      - name: Recalculate 50 pinned SKUs from live Rossko stock, do NOT publish
        run: python avito_sync_staging.py
      - name: Save temporary XML and status report for review
        uses: actions/upload-artifact@v4
        with:
          name: avito-50-live-price-STAGING-not-connected
          path: output/avito_price_stock_staging/
          retention-days: 2
          if-no-files-found: error
