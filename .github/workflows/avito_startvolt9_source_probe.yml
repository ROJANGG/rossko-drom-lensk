name: Avito first wave STARTVOLT exact manufacturer OEM and photos (review only)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/avito_startvolt9_source_probe.yml']
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c0d8bef43bfd0f9c5f69b7221abc569eca9999ce
          path: code
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4 pillow
      - name: Check exact manufacturer source and true JPEG bytes
        run: python code/avito_startvolt9_source_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AVITO_STARTVOLT_9_MANUFACTURER_PHOTO_EVIDENCE_REVIEW_ONLY
          path: manufacturer_proof/
          retention-days: 3
          if-no-files-found: ignore
