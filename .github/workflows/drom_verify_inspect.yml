name: Drom verify diagnostic - read only
on:
  workflow_dispatch:
  push:
    branches: [feature/avito-irkutsk-draft]
    paths:
      - 'drom_verify_inspect.py'
      - '.github/workflows/drom_verify_inspect.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python drom_verify_inspect.py
