
name: ROSSKO API Wholesale Price Check

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rossko_wholesale_private_audit.yml'

permissions:
  contents: read

jobs:
  check-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ac5223fb613580b7c5aef40dec605318e9e6a8c8
          path: audit
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          ref: main
          path: supplier
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install "zeep>=4.3,<5" "openpyxl>=3.1,<4"

      - name: Test price/warehouse safeguards offline
        env:
          PYTHONPATH: audit
        run: python -m unittest discover -s audit/tests -p 'test_rossko_wholesale_*.py' -v

      - name: Compare wholesale and price-list prices
        env:
          ROSSKO_API_KEY1: ${{ secrets.ROSSKO_API_KEY1 }}
          ROSSKO_API_KEY2: ${{ secrets.ROSSKO_API_KEY2 }}
        run: |
          python audit/rossko_wholesale_private_audit.py \
            --price supplier/input/rossko_price.xlsx \
            --output private_audit

      - name: Preview wholesale-based Drom and Avito prices privately - no publication
        if: always()
        env:
          PYTHONPATH: audit
        run: |
          if [ -f private_audit/private_price_comparison.csv ]; then
            python audit/rossko_wholesale_price_preview.py \
              --api-csv private_audit/private_price_comparison.csv \
              --output private_audit
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ROSSKO_WHOLESALE_PRICE_CHECK
          path: private_audit/
          retention-days: 2
          if-no-files-found: ignore
