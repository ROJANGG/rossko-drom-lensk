
name: ROSSKO API Wholesale Price Check

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rossko_wholesale_private_audit.yml'

permissions:
  contents: read

jobs:
  check-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 09b2bb6d0d8b893e50f06e4933e27c7dfd37466f
          path: audit
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          ref: main
          path: supplier
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install "zeep>=4.3,<5" "openpyxl>=3.1,<4"

      - name: Test price/warehouse safeguards offline
        env:
          PYTHONPATH: audit
        run: python -m unittest discover -s audit/tests -p test_rossko_wholesale_private_audit.py -v

      - name: Compare wholesale and price-list prices
        env:
          ROSSKO_API_KEY1: ${{ secrets.ROSSKO_API_KEY1 }}
          ROSSKO_API_KEY2: ${{ secrets.ROSSKO_API_KEY2 }}
        run: |
          python audit/rossko_wholesale_private_audit.py \
            --price supplier/input/rossko_price.xlsx \
            --output private_audit

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ROSSKO_WHOLESALE_PRICE_CHECK
          path: private_audit/
          retention-days: 2
          if-no-files-found: ignore
