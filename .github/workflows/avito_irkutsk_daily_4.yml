name: Avito Irkutsk - four daily 145-SKU controlled XML refresh

# One independent workflow in main. Drom workflow/code is untouched.
# Customer-facing descriptions were updated on 2026-10-16 to omit supplier names.
# Original 50 plus staged CTR additions and 66 sourced OEM items; preserve all permanent IDs.
# 2026-10-20: GD0123 JPEG goes through tested jsDelivr CDN after Avito timeout on GitHub raw; all IDs unchanged.
# 23:17, 03:17, 07:17, 11:17 UTC = 07:17, 11:17, 15:17, 19:17 Irkutsk (UTC+8).
# Avito Pro already reads the existing stable XML URL; a push updates real listings.
on:
  schedule:
    - cron: '17 3,7,11,23 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/avito_irkutsk_daily_4.yml'

permissions:
  contents: write

concurrency:
  group: avito-irkutsk-four-daily-feed
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 26
    steps:
      - name: Checkout isolated Avito generator (never change Drom main files)
        uses: actions/checkout@v4
        with:
          ref: feature/avito-irkutsk-draft
          path: generator
          persist-credentials: false
      - name: Checkout existing preview XML branch
        uses: actions/checkout@v4
        with:
          ref: avito-irkutsk-feed
          path: preview
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install required packages
        run: python -m pip install 'openpyxl>=3.1.2' 'requests>=2.31.0' 'pillow>=10.0'
      - name: Check safeguards for ID, price and missing-stock changes
        working-directory: generator
        run: python -m unittest discover -s tests -p 'test_avito_feed_transition.py' -v
      - name: Download fresh ROSSKO price, fifty source-verified OEM SKUs
        working-directory: generator
        run: python avito_sync_staging.py
      - name: Add only two CTR discs with manufacturer OEM and verified supplier photo nomenclature
        working-directory: generator
        run: |
          python avito_expand_canary.py \
            --pilot-xml output/avito_price_stock_staging/AVITO_XML_PRICE_STOCK_STAGING_NOT_LIVE.xml \
            --out output/avito_price_stock_staging/AVITO_TWO_NEW_DRAFT.xml
      - name: Add five more verified CTR discs from fresh Irkutsk supplier stock
        working-directory: generator
        run: |
          python avito_next_five_preflight.py \
            --base-xml output/avito_price_stock_staging/AVITO_TWO_NEW_DRAFT.xml \
            --out output/avito_next_five_live \
            --live-candidate \
            --allow-small-stock-removals
      - name: Add second five exact-OEM CTR discs from fresh Irkutsk stock
        working-directory: generator
        run: |
          python avito_second_five_preflight.py \
            --base-xml output/avito_next_five_live/AVITO_NEXT_FIVE_LIVE_CANDIDATE.xml \
            --out output/avito_second_five_live \
            --live-candidate \
            --allow-small-stock-removals
      - name: Add ten more CTR discs from sourced OEM and current Irkutsk inventory
        working-directory: generator
        run: |
          python avito_third_ten_preflight.py \
            --base-xml output/avito_second_five_live/AVITO_SECOND_FIVE_LIVE_CANDIDATE.xml \
            --out output/avito_third_ten_live \
            --live-candidate \
            --allow-small-stock-removals
      - name: Add all 11 remaining CTR manufacturer-OEM discs from fresh Irkutsk stock
        working-directory: generator
        run: |
          python avito_fourth_eleven_preflight.py \
            --base-xml output/avito_third_ten_live/AVITO_THIRD_TEN_LIVE_CANDIDATE.xml \
            --out output/avito_fourth_eleven_live \
            --live-candidate \
            --allow-small-stock-removals
      - name: Add 66 sourced-OEM NGN Marshall Master KiT Fenox items from fresh Irkutsk stock
        working-directory: generator
        run: |
          python avito_bulk66_preflight.py \
            --base-xml output/avito_fourth_eleven_live/AVITO_FOURTH_ELEVEN_LIVE_CANDIDATE.xml \
            --out output/avito_bulk66_live \
            --live-candidate \
            --allow-small-stock-removals
      - name: Mirror supplier photos for 50 original plus 33 CTR and 66 sourced-OEM extras
        working-directory: generator
        run: |
          python avito_image_mirror.py \
            --candidate output/avito_bulk66_live/AVITO_BULK66_LIVE_CANDIDATE.xml \
            --image-dir ../preview/avito-images \
            --output output/avito_price_stock_staging/AVITO_XML_MIRRORED_JPEG.xml \
            --manifest output/avito_price_stock_staging/avito_photo_manifest.json \
            --approved-new input/avito_canary_2_new.csv \
            --approved-next-five \
            --approved-second-five \
            --approved-third-ten \
            --approved-fourth-eleven \
            --approved-bulk66
      - name: Compare candidate against current public XML - fail closed
        working-directory: generator
        run: |
          python avito_feed_transition.py \
            --previous ../preview/AVITO_PILOT_4_PREVIEW_NOT_LIVE.xml \
            --candidate output/avito_price_stock_staging/AVITO_XML_MIRRORED_JPEG.xml \
            --report output/avito_price_stock_staging/transition_precheck.json \
            --approved-new input/avito_canary_2_new.csv \
            --approved-next-five \
            --approved-second-five \
            --approved-third-ten \
            --approved-fourth-eleven \
            --approved-bulk66
      - name: Replace ONLY the isolated pilot XML when validated
        env:
          TARGET_BRANCH: avito-irkutsk-feed
        shell: bash
        run: |
          set -euo pipefail
          cp generator/output/avito_price_stock_staging/AVITO_XML_MIRRORED_JPEG.xml preview/AVITO_PILOT_4_PREVIEW_NOT_LIVE.xml
          cd preview
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AVITO_PILOT_4_PREVIEW_NOT_LIVE.xml avito-images/
          if git diff --cached --quiet; then
            echo "No price or stock change: public XML unchanged"
          else
            git commit -m "Avito 145-SKU controlled feed: fresh Rossko price and local stock"
            git push origin "HEAD:${TARGET_BRANCH}"
          fi
      - name: Save short-lived private audit (not a public auto-publisher)
        uses: actions/upload-artifact@v4
        with:
          name: avito-fifty-refresh-audit
          path: |
            generator/output/avito_price_stock_staging/summary.json
            generator/output/avito_price_stock_staging/avito_50_sync_audit.csv
            generator/output/avito_price_stock_staging/transition_precheck.json
            generator/output/avito_price_stock_staging/avito_photo_manifest.json
          retention-days: 2
          if-no-files-found: error
