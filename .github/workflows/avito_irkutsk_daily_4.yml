name: Avito Irkutsk - four daily verified wholesale and stock XML refresh
# Avito ONLY. Never updates Drom. Live feed is touched only after supplier
# stock is fresh, missing items are independently rechecked, and all
# existing IDs/OEM/photos/descriptions pass the fail-closed controls.
on:
  schedule:
    - cron: '17 3,7,11,23 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/avito_irkutsk_daily_4.yml'

permissions:
  contents: write

concurrency:
  group: avito-irkutsk-four-daily-feed
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      ROSSKO_RUN_PRICE_CACHE: /tmp/rossko_${{ github.run_id }}.xlsx
    steps:
      - name: Checkout tested Avito-only active catalogue refresher
        uses: actions/checkout@v4
        with:
          ref: 1fc9f5fa1e5b9c791182c71425ea46618bff4eff
          path: generator
          persist-credentials: false

      - name: Checkout live Avito XML and immutable approved SKU archive
        uses: actions/checkout@v4
        with:
          ref: avito-irkutsk-feed
          path: preview
          persist-credentials: true

      - name: Checkout retail-only price overrides from verified ROSSKO API
        uses: actions/checkout@v4
        with:
          ref: main
          path: retail
          persist-credentials: false

      - name: Checkout reviewed exact-SKU extension support
        uses: actions/checkout@v4
        with:
          ref: 405f5e221588a3959e09ab7d8a102ce4921891cd
          path: verified-extension
          persist-credentials: false
      - name: Load verified additional categories without broadening the approved catalogue
        run: |
          cp verified-extension/avito_irkutsk.py generator/
          cp verified-extension/tests/test_avito_price_download.py generator/tests/
          cp verified-extension/avito_active_feed_refresh.py generator/
          cp verified-extension/input/avito_verified_extension_evidence.json generator/input/
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install source-file parser
        run: python -m pip install 'openpyxl>=3.1,<4' 'requests>=2.31,<3'

      - name: Test strict matching ID OEM photos absence and stock restoration
        working-directory: generator
        run: |
          python -m unittest discover -s tests -p 'test_avito_active_feed_refresh.py' -v
          python -m unittest discover -s tests -p 'test_avito_price_download.py' -v

      - name: Select latest Avito-only verified retail price map without touching Drom
        shell: bash
        run: |
          set -euo pipefail
          if [ -s preview/avito-verified-retail-prices.csv ]; then
            cp preview/avito-verified-retail-prices.csv retail/avito-selected-retail-map.csv
            echo "Using latest Avito-only verified retail map"
          else
            cp retail/input/rossko_verified_retail_prices.csv retail/avito-selected-retail-map.csv
            echo "Using initial source-matched verified retail map"
          fi

      - name: Build validated fresh-price and two-snapshot stock XML
        run: |
          python generator/avito_active_feed_refresh.py \
            --config generator/config.json \
            --previous preview/AVITO_PILOT_4_PREVIEW_NOT_LIVE.xml \
            --approved-catalog preview/AVITO_APPROVED_CATALOG_195_ARCHIVE.xml \
            --verified-retail-map retail/avito-selected-retail-map.csv \
            --out result \
            --max-removals 12

      - name: Verify controlled XML transition and never permit bulk disappearance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from xml.etree import ElementTree as ET
          report=json.loads(Path("result/report.json").read_text(encoding="utf-8"))
          before=report["current_live_before"]
          after=report["after"]
          removed=report["removed_from_previous_live_feed"]
          restored=report["restocked_approved_ads"]
          if not 150<=after<=300 or before+len(restored)-len(removed)!=after:
              raise SystemExit("REFUSE_AVITO_RELEASE: unexpected XML count")
          if len(removed)>12 or len(removed)/before>0.075 or len(restored)>12:
              raise SystemExit("REFUSE_AVITO_RELEASE: unexpected stock change")
          if not report["removed_independently_verified"] or not report["restock_supplier_double_checked"]:
              raise SystemExit("REFUSE_AVITO_RELEASE: stock not double-checked")
          xml=ET.parse("result/AVITO_ACTIVE_PRICES_STOCK_CANDIDATE.xml").getroot()
          ads=xml.findall("Ad")
          ids=[x.findtext("Id") for x in ads]
          if len(ads)!=after or None in ids or len(set(ids))!=len(ids):
              raise SystemExit("REFUSE_AVITO_RELEASE: missing/duplicate IDs")
          if any(not x.findtext("OEM") or not x.find("Images/Image") is not None for x in ads):
              raise SystemExit("REFUSE_AVITO_RELEASE: original OEM/photo missing")
          print("AVITO_APPROVED_STOCK_PRICE_REFRESH",json.dumps({
              "before":before,"after":after,"confirmed_stock_removed":len(removed),
              "restocked_existing_IDs":len(restored),"verified_prices_changed":report["repriced"],
              "unverified_prices_kept":report["price_kept_unverified"]
          }))
          PY

      - name: Publish validated Avito XML ONLY (never touch supplier or Drom files)
        shell: bash
        run: |
          set -euo pipefail
          cp result/AVITO_ACTIVE_PRICES_STOCK_CANDIDATE.xml preview/AVITO_PILOT_4_PREVIEW_NOT_LIVE.xml
          cd preview
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AVITO_PILOT_4_PREVIEW_NOT_LIVE.xml
          if git diff --cached --quiet; then
            echo "No Avito price or verified stock change; live feed unchanged"
          else
            git commit -m "Avito: refresh only approved SKUs, verified personal retail prices and fresh Irkutsk stock"
            git push origin HEAD:avito-irkutsk-feed
          fi

      - name: Save short-lived private stock and retail-only price audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AVITO_VERIFIED_STOCK_AND_PRICING_AUDIT
          path: result/report.json
          retention-days: 2
          if-no-files-found: ignore
