name: Avito - first-pass review of 100 expansion SKUs
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/avito_expansion_batch03_review.yml'
permissions:
  contents: read
concurrency:
  group: avito-irkutsk-four-daily-feed
  cancel-in-progress: false
jobs:
  hundred-sku-review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ROSSKO_RUN_PRICE_CACHE: /tmp/rossko_${{ github.run_id }}.xlsx
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1fc9f5fa1e5b9c791182c71425ea46618bff4eff
          path: generator
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'requests>=2.31,<3' 'openpyxl>=3.1,<4' 'zeep>=4.3,<5'
      - name: Test batch scope, outage limit and private-price exclusion
        working-directory: source
        run: python -m unittest discover -s tests -p test_avito_expansion_batch03_review.py -v
      - name: Load only the bounded hundred-SKU review
        run: |
          cp source/avito_expansion_batch03_review.py generator/
          cp source/avito_irkutsk.py generator/
          cp source/input/avito_expansion_batch03_20261113.json generator/input/
      - name: Check exact account prices and Irkutsk zero-day stock; never publish
        working-directory: generator
        env:
          ROSSKO_API_KEY1: ${{ secrets.ROSSKO_API_KEY1 }}
          ROSSKO_API_KEY2: ${{ secrets.ROSSKO_API_KEY2 }}
        run: python avito_expansion_batch03_review.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AVITO_EXPANSION_BATCH03_RETAIL_ONLY_REVIEW
          path: generator/review/
          if-no-files-found: ignore
