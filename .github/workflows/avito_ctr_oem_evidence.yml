name: Avito 100 CTR documented OEM evidence (review only)
on:
  workflow_dispatch:
  push:
    branches: [feature/avito-irkutsk-draft]
    paths:
      - avito_ctr_oem_evidence.py
      - tests/test_avito_ctr_oem_evidence.py
      - .github/workflows/avito_ctr_oem_evidence.yml
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install HTTP client
        run: python -m pip install 'requests>=2.31.0'
      - name: Test exact-item evidence extraction
        run: python -m unittest discover -s tests -p 'test_avito_ctr_oem_evidence.py' -v
      - name: Read manufacturer OEM pages for 33 new CTR brake discs
        run: python avito_ctr_oem_evidence.py
      - name: Save review-only manufacturer evidence (NOT XML)
        uses: actions/upload-artifact@v4
        with:
          name: AVITO_CTR_OEM_EVIDENCE_REVIEW
          path: output/avito_ctr_oem_evidence/
          retention-days: 2
          if-no-files-found: error
