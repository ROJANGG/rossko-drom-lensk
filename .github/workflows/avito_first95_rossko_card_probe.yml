name: Avito first 95 - product OEM photo original Rossko source feasibility (READ ONLY)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/avito_first95_rossko_card_probe.yml'
permissions:
  contents: read
jobs:
  investigate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a150d11c18d487a1d34d574d3d88c5d9499e4b2f
          path: research
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'zeep>=4.3,<5' 'openpyxl>=3.1,<4' 'beautifulsoup4>=4.12,<5' 'requests>=2.31,<3'
      - name: Check robots permission and three exact SKUs from private API on public catalog
        env:
          ROSSKO_API_KEY1: ${{ secrets.ROSSKO_API_KEY1 }}
          ROSSKO_API_KEY2: ${{ secrets.ROSSKO_API_KEY2 }}
        run: python research/avito_first95_card_diagnostic.py
