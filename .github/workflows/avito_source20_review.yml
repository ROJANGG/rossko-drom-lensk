name: Avito - next 100 555 stabilizer links fresh review Nov19
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/avito_source20_review.yml'
permissions:
  contents: read
concurrency:
  group: avito-irkutsk-four-daily-feed
  cancel-in-progress: false
jobs:
  hundred-sku-review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ROSSKO_RUN_PRICE_CACHE: /tmp/rossko_${{ github.run_id }}.xlsx
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1fc9f5fa1e5b9c791182c71425ea46618bff4eff
          path: generator
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'requests>=2.31,<3' 'openpyxl>=3.1,<4' 'zeep>=4.3,<5'
      - name: Test batch scope, outage limit and private-price exclusion
        working-directory: source
        run: python -m unittest discover -s tests -p test_avito_source20_review.py -v
      - name: Load only the bounded hundred-SKU review
        run: |
          cp source/avito_source20_review.py generator/
          cp source/avito_irkutsk.py generator/
          cp source/input/avito_source20_20261119.json generator/input/
      - name: Bound fresh supplier download latency
        run: |
          python - <<'PY2'
          import json
          from pathlib import Path
          p=Path('generator/config.json');c=json.loads(p.read_text());c['rossko']['download_timeout_seconds']=20;p.write_text(json.dumps(c,ensure_ascii=False))
          PY2
      - name: Check exact account prices and Irkutsk zero-day stock; never publish
        working-directory: generator
        env:
          ROSSKO_API_KEY1: ${{ secrets.ROSSKO_API_KEY1 }}
          ROSSKO_API_KEY2: ${{ secrets.ROSSKO_API_KEY2 }}
        run: python avito_source20_review.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AVITO_SOURCE20_RETAIL_ONLY_REVIEW
          path: generator/review/
          if-no-files-found: ignore
  recover-current-CDN:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: support
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: avito-irkutsk-feed
          path: feed
          sparse-checkout: AVITO_PILOT_4_PREVIEW_NOT_LIVE.xml
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Verify current XML and request one bounded cache refresh if needed
        run: python support/avito_refresh_public_cdn.py --xml feed/AVITO_PILOT_4_PREVIEW_NOT_LIVE.xml
      - name: Observe actual direct and CDN bytes without another purge
        if: always()
        run: |
          python - <<'PY'
          import urllib.request,hashlib,json,xml.etree.ElementTree as E
          from pathlib import Path
          expected=Path('feed/AVITO_PILOT_4_PREVIEW_NOT_LIVE.xml').read_bytes()
          audit={'expected_ads':len(E.fromstring(expected)),'expected_sha256':hashlib.sha256(expected).hexdigest(),'XML_publication_performed':False}
          for name,url in [('raw','https://raw.githubusercontent.com/ROJANGG/rossko-drom-lensk/avito-irkutsk-feed/AVITO_PILOT_4_PREVIEW_NOT_LIVE.xml'),('cdn','https://cdn.jsdelivr.net/gh/ROJANGG/rossko-drom-lensk@avito-irkutsk-feed/AVITO_PILOT_4_PREVIEW_NOT_LIVE.xml')]:
              try:
                  with urllib.request.urlopen(url,timeout=15) as response:raw=response.read(8000001)
                  audit[name]={'ads':len(E.fromstring(raw)),'sha256':hashlib.sha256(raw).hexdigest(),'exact':raw==expected}
              except Exception as e:audit[name]={'error_class':type(e).__name__,'exact':False}
          print('AVITO_DELIVERY_AUDIT',json.dumps(audit),flush=True)
          PY
