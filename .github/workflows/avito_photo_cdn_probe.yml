name: Avito photo hosts - test raw GitHub vs jsDelivr (no publication)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/avito_photo_cdn_probe.yml']

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: avito-irkutsk-feed
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'requests>=2.31.0' 'pillow>=10.0'
      - name: Verify raw and alternate CDN JPEGs return real exact bytes without cookies
        shell: bash
        run: |
          python - <<'PY'
          import io, hashlib, time
          from xml.etree import ElementTree as ET
          import requests
          from PIL import Image
          ads=ET.parse('AVITO_PILOT_4_PREVIEW_NOT_LIVE.xml').getroot().findall('Ad')
          if len(ads)<50:
              raise SystemExit('Not a valid current live feed')
          wanted=('GD0123','GD0109','GD0031')
          base='https://raw.githubusercontent.com/ROJANGG/rossko-drom-lensk/avito-irkutsk-feed/avito-images/'
          cdn='https://cdn.jsdelivr.net/gh/ROJANGG/rossko-drom-lensk@avito-irkutsk-feed/avito-images/'
          rows={}
          for ad in ads:
              title=ad.findtext('Title') or ''
              for part in wanted:
                  if 'CTR '+part+' ' in title:
                      source=ad.find('./Images/Image').get('url')
                      if not source.startswith(base):
                          raise SystemExit('Source host unexpected: '+source)
                      rows[part]=source[len(base):]
          if set(rows)!=set(wanted):
              raise SystemExit('Cannot find all three CTR articles')
          for part, filename in rows.items():
              fingerprints={}
              for host,url in [('github_raw',base+filename),('jsdelivr',cdn+filename)]:
                  start=time.monotonic()
                  response=requests.get(url,timeout=(8,18),headers={'Accept':'image/jpeg'},allow_redirects=False)
                  elapsed=round(time.monotonic()-start,2)
                  content_type=response.headers.get('Content-Type','')
                  print('AVITO_PHOTO_HOST_PROBE',part,host,'HTTP',response.status_code,
                        'seconds',elapsed,'bytes',len(response.content),'MIME',content_type,flush=True)
                  response.raise_for_status()
                  if 'image/jpeg' not in content_type.lower() or not response.content.startswith(b'\\xff\\xd8\\xff'):
                      raise SystemExit('Host did not serve direct JPEG for '+part+' '+host)
                  img=Image.open(io.BytesIO(response.content))
                  img.verify()
                  if len(response.content)<1000:
                      raise SystemExit('Badly truncated JPEG for '+part+' '+host)
                  fingerprints[host]=hashlib.sha256(response.content).hexdigest()
              if fingerprints['github_raw']!=fingerprints['jsdelivr']:
                  raise SystemExit('Different JPEG bytes across hosts for '+part)
          print('AVITO_PHOTO_HOST_PROBE_SUCCESS: 3 exact products, 6 direct JPEGs, sha256 equal')
          PY
