name: Avito STARTVOLT GLSP026 GLSP066 — personal stock API check (REVIEW ONLY)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/avito_startvolt_026_066_delivery.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    env:
      ROSSKO_RUN_PRICE_CACHE: /tmp/rossko_${{ github.run_id }}.xlsx
      ROSSKO_API_KEY1: ${{ secrets.ROSSKO_API_KEY1 }}
      ROSSKO_API_KEY2: ${{ secrets.ROSSKO_API_KEY2 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 96a464c08e96e491788cdae93d2757b4fdbd9f97
          path: code
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'zeep>=4.3,<5' 'openpyxl>=3.1,<4' 'requests>=2.31,<3'
      - name: Check each exact GLSP article and deliverability without publication
        run: python code/avito_startvolt_026_066_delivery_diagnostic.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AVITO_STARTVOLT_026_066_LIVE_API_DELIVERY_PRIVATE
          path: status.json
          retention-days: 2
          if-no-files-found: ignore
