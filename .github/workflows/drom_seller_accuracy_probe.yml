name: Drom ROSSKO SKU result accuracy sanity check (5 queries)
on:
  workflow_dispatch:
  push:
    branches: [feature/avito-irkutsk-draft]
    paths:
      - 'drom_seller_accuracy_probe.py'
      - '.github/workflows/drom_seller_accuracy_probe.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4
      - run: python drom_seller_accuracy_probe.py
