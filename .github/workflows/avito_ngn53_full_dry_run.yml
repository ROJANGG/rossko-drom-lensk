name: Avito NGN53 complete private release dry run (no publication)

on:
  workflow_dispatch:
  push:
    branches: [feature/avito-irkutsk-draft]
    paths:
      - 'avito_ngn53_preflight.py'
      - 'input/avito_ngn53_original_oem_pinned.csv'
      - 'avito_image_mirror.py'
      - 'avito_feed_transition.py'
      - 'tests/test_avito_ngn53_preflight.py'
      - '.github/workflows/avito_ngn53_full_dry_run.yml'

permissions:
  contents: read

concurrency:
  group: avito-ngn53-full-preflight
  cancel-in-progress: true

jobs:
  end-to-end:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ROSSKO_RUN_PRICE_CACHE: /tmp/rossko_ngn53_${{ github.run_id }}.xlsx
    steps:
      - name: Checkout generator, source evidence and tests
        uses: actions/checkout@v4
        with:
          ref: feature/avito-irkutsk-draft
          path: generator
          persist-credentials: false
      - name: Checkout live feed for transition comparison and temporary images only
        uses: actions/checkout@v4
        with:
          ref: avito-irkutsk-feed
          path: preview
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install requirements
        run: python -m pip install 'openpyxl>=3.1.2' 'requests>=2.31.0' 'pillow>=10.0' 'beautifulsoup4>=4.12'
      - name: Test 53 OEM/ID safeguards and image+transition code
        working-directory: generator
        run: |
          python -m unittest discover -s tests -p 'test_avito_ngn53_preflight.py' -v
          python -m unittest discover -s tests -p 'test_avito_feed_transition.py' -v
          python -m unittest discover -s tests -p 'test_avito_image_mirror.py' -v
      - name: Generate original fifty from a single fresh supplier price snapshot
        working-directory: generator
        run: python avito_sync_staging.py
      - name: Generate CTR 2 from same supplier snapshot
        working-directory: generator
        run: python avito_expand_canary.py --pilot-xml output/avito_price_stock_staging/AVITO_XML_PRICE_STOCK_STAGING_NOT_LIVE.xml --out output/avito_price_stock_staging/AVITO_TWO_NEW_DRAFT.xml
      - name: Generate CTR first five
        working-directory: generator
        run: python avito_next_five_preflight.py --base-xml output/avito_price_stock_staging/AVITO_TWO_NEW_DRAFT.xml --out output/avito_next_five_live --live-candidate --allow-small-stock-removals
      - name: Generate CTR second five
        working-directory: generator
        run: python avito_second_five_preflight.py --base-xml output/avito_next_five_live/AVITO_NEXT_FIVE_LIVE_CANDIDATE.xml --out output/avito_second_five_live --live-candidate --allow-small-stock-removals
      - name: Generate CTR third ten
        working-directory: generator
        run: python avito_third_ten_preflight.py --base-xml output/avito_second_five_live/AVITO_SECOND_FIVE_LIVE_CANDIDATE.xml --out output/avito_third_ten_live --live-candidate --allow-small-stock-removals
      - name: Generate CTR fourth eleven
        working-directory: generator
        run: python avito_fourth_eleven_preflight.py --base-xml output/avito_third_ten_live/AVITO_THIRD_TEN_LIVE_CANDIDATE.xml --out output/avito_fourth_eleven_live --live-candidate --allow-small-stock-removals
      - name: Generate 66 verified OEM old additions
        working-directory: generator
        run: python avito_bulk66_preflight.py --base-xml output/avito_fourth_eleven_live/AVITO_FOURTH_ELEVEN_LIVE_CANDIDATE.xml --out output/avito_bulk66_live --live-candidate --allow-small-stock-removals
      - name: Add 53 NGN original-maker sourced discs
        working-directory: generator
        run: python avito_ngn53_preflight.py --base-xml output/avito_bulk66_live/AVITO_BULK66_LIVE_CANDIDATE.xml --out output/avito_ngn53_release --allow-small-stock-removals
      - name: Fetch and mirror all currently in stock photos to TEMPORARY local checkout
        working-directory: generator
        run: |
          python avito_image_mirror.py \
            --candidate output/avito_ngn53_release/AVITO_NGN53_LIVE_CANDIDATE.xml \
            --image-dir ../preview/avito-images \
            --output output/avito_ngn53_release/AVITO_NGN53_JPEG_MIRRORED_REVIEW_NOT_LIVE.xml \
            --manifest output/avito_ngn53_release/photo_manifest.json \
            --approved-new input/avito_canary_2_new.csv \
            --approved-next-five --approved-second-five --approved-third-ten \
            --approved-fourth-eleven --approved-bulk66 --approved-ngn53
      - name: Fail-closed transition comparing previous live XML and current full proposed catalog
        working-directory: generator
        run: |
          python avito_feed_transition.py \
            --previous ../preview/AVITO_PILOT_4_PREVIEW_NOT_LIVE.xml \
            --candidate output/avito_ngn53_release/AVITO_NGN53_JPEG_MIRRORED_REVIEW_NOT_LIVE.xml \
            --report output/avito_ngn53_release/transition_check.json \
            --approved-new input/avito_canary_2_new.csv \
            --approved-next-five --approved-second-five --approved-third-ten \
            --approved-fourth-eleven --approved-bulk66 --approved-ngn53
      - name: Test local files for every newly pinned photograph
        working-directory: generator
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          from avito_ngn53_preflight import approved_ngn53_ids
          manifest=json.loads(Path('output/avito_ngn53_release/photo_manifest.json').read_text())
          assert approved_ngn53_ids() <= set(manifest), "Missing new NGN photo in mirrored output"
          for sid in approved_ngn53_ids():
              url=manifest[sid]['url']
              assert url.startswith('https://cdn.jsdelivr.net/gh/ROJANGG/rossko-drom-lensk@avito-irkutsk-feed/avito-images/')
              fname=url.rsplit('/',1)[-1]
              with Image.open(Path('../preview/avito-images')/fname) as im:
                  im.verify()
          print('NGN53_PRIVATE_JPEG_VALIDATION_SUCCESS',len(approved_ngn53_ids()))
          PY
      - name: Upload review-only summary and transition, never publish
        uses: actions/upload-artifact@v4
        with:
          name: AVITO_NGN53_END_TO_END_PRIVATE_REVIEW
          path: |
            generator/output/avito_ngn53_release/summary.json
            generator/output/avito_ngn53_release/photo_manifest.json
            generator/output/avito_ngn53_release/transition_check.json
            generator/output/avito_ngn53_release/AVITO_NGN53_JPEG_MIRRORED_REVIEW_NOT_LIVE.xml
          retention-days: 2
          if-no-files-found: error
