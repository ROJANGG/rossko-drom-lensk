name: Avito STARTVOLT GLSP508 GLSP516 — independent ROSSKO same-day verification (NO PUBLISH)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/avito_startvolt_delivery_diagnostic.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      ROSSKO_RUN_PRICE_CACHE: /tmp/rossko_${{ github.run_id }}.xlsx
      ROSSKO_API_${{ secrets.ROSSKO_API_KEY1 }}: KEY1
      ROSSKO_API_${{ secrets.ROSSKO_API_KEY2 }}: KEY2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 28de8ffc28aad5919bea014d32b9d947b4f6344a
          path: code
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'zeep>=4.3,<5' 'openpyxl>=3.1,<4' 'requests>=2.31,<3'
      - name: Independently verify both parts - no catalog uploads
        run: python code/avito_startvolt_stock_delivery_diagnostic.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: STARTVOLT_508_516_LOCAL_DELIVERY_PRIVATE_REVIEW
          path: status.json
          retention-days: 2
          if-no-files-found: ignore
