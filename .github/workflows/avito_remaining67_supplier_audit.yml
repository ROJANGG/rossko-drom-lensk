name: Avito remaining 67 supplier evidence audit (NO PUBLICATION)
on:
  workflow_dispatch:
  push:
    branches: [feature/avito-irkutsk-draft]
    paths:
      - avito_remaining67_supplier_audit.py
      - tests/test_avito_remaining67_supplier_audit.py
      - input/avito_remaining_67_NOT_READY_FOR_UPLOAD.csv
      - .github/workflows/avito_remaining67_supplier_audit.yml
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install 'openpyxl>=3.1.2' 'requests>=2.31.0'
      - name: Test no unverified OEM is published
        run: python -m unittest discover -s tests -p 'test_avito_remaining67_supplier_audit.py' -v
      - name: Fetch fresh Rossko Irkutsk price and audit 67 pending part numbers
        run: python avito_remaining67_supplier_audit.py
      - name: Save private review artifact (never Avito XML)
        uses: actions/upload-artifact@v4
        with:
          name: avito-remaining67-evidence-audit-NOT-LIVE
          path: output/avito_remaining67_supplier_audit/
          retention-days: 2
          if-no-files-found: error
