name: Update Rossko photos

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "How many new products to scan. Use 50 for test, 0 for all."
        required: true
        default: "50"
      start:
        description: "Skip first N products from price before scanning"
        required: true
        default: "0"

permissions:
  contents: write

jobs:
  update-photos:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Find Rossko photos
        run: python update_photos_rossko.py --limit "${{ github.event.inputs.limit }}" --start "${{ github.event.inputs.start }}"

      - name: Generate Drom price file
        run: python update_prices.py

      - name: Commit updated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add input/photos.csv input/rossko_price.xlsx public/drom_lensk.xlsx logs/updates.log
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update Rossko photos"
            git push
          fi
