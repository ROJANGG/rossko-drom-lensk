name: Avito - diagnose stale CDN delivery without XML changes
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/avito_delivery_diagnostics_20261118.yml']
permissions:
  contents: read
jobs:
  delivery:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect purge response and public delivery variants
        run: |
          python - <<'PY'
          import urllib.request,hashlib,json,xml.etree.ElementTree as E,time
          path='/gh/ROJANGG/rossko-drom-lensk@avito-irkutsk-feed/AVITO_PILOT_4_PREVIEW_NOT_LIVE.xml'
          cdn='https://cdn.jsdelivr.net'+path
          for label,url,headers in [('purge','https://purge.jsdelivr.net'+path,{}),('normal',cdn,{}),('no_cache',cdn,{'Cache-Control':'no-cache','Pragma':'no-cache'}),('version_query',cdn+'?v=20261118-564',{}),('normal_after',cdn,{})]:
              try:
                  req=urllib.request.Request(url,headers=headers)
                  with urllib.request.urlopen(req,timeout=15) as response:
                      raw=response.read(8000001);h={k:response.headers.get(k) for k in ['Age','Cache-Control','X-Cache','X-Served-By','X-Jsd-Version-Type','X-Jsd-Version']}
                  if label=='purge':print('PURGE_DIAGNOSTIC',raw.decode()[:6000],h,flush=True)
                  else:print('DELIVERY_DIAGNOSTIC',label,json.dumps({'ads':len(E.fromstring(raw)),'sha256':hashlib.sha256(raw).hexdigest(),'headers':h}),flush=True)
              except Exception as e:print('DIAGNOSTIC_ERROR',label,type(e).__name__,flush=True)
          PY
