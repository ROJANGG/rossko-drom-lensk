name: Update Drom price file

on:
  workflow_dispatch:
  schedule:
    # UTC. Примерно 07:00, 11:00, 15:00, 18:00 по Москве.
    - cron: "0 4,8,12,15 * * *"

permissions:
  contents: write

jobs:
  update-price:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Generate Drom price file
        run: python update_prices.py

      - name: Commit updated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/drom_lensk.xlsx input/rossko_price.xlsx logs/updates.log
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update Drom price file"
            git push
          fi
