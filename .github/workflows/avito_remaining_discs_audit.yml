name: Avito remaining Irkutsk brake discs - private stock and photo audit

on:
  workflow_dispatch:
  push:
    branches: [feature/avito-irkutsk-draft]
    paths:
      - 'avito_remaining_discs_audit.py'
      - 'tests/test_avito_remaining_discs_audit.py'
      - '.github/workflows/avito_remaining_discs_audit.yml'

permissions:
  contents: read

concurrency:
  group: avito-remaining-discs-review
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - name: Checkout audit generator (no publication access)
        uses: actions/checkout@v4
        with:
          ref: feature/avito-irkutsk-draft
      - name: Checkout current live public XML separately
        uses: actions/checkout@v4
        with:
          ref: avito-irkutsk-feed
          path: live
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install 'openpyxl>=3.1.2' 'requests>=2.31.0' 'pillow>=10.0'
      - name: Validate stable-ID and local-stock guardrails
        run: python -m unittest discover -s tests -p 'test_avito_remaining_discs_audit.py' -v
      - name: Check unpublished brake discs against fresh Irkutsk ROSSKO price and real photo bytes
        run: |
          python avito_remaining_discs_audit.py \
            --public-feed live/AVITO_PILOT_4_PREVIEW_NOT_LIVE.xml \
            --out output/avito_remaining_discs_review
      - name: Save short-lived private review bundle (not for Avito import)
        uses: actions/upload-artifact@v4
        with:
          name: AVITO_REMAINING_DISCS_PRIVATE_REVIEW
          path: output/avito_remaining_discs_review/
          retention-days: 2
          if-no-files-found: error
